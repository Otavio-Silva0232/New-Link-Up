<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Up | Login</title>
    <link rel="stylesheet" href="/Login/style.css">
</head>
<body>

    <nav class="auth-toggle" aria-label="Alternar entre login e cadastro">
        <button type="button" id="botaoLogin" class="ativo">Login</button>
        <button type="button" id="botaoCadastro">Cadastrar</button>
    </nav>

    <main class="welcome-panel">
        <div class="welcome-content">
            <p class="welcome-eyebrow">LINK UP</p>
            <h1>Conecte-se.<br>Crie. Cresça.</h1>
            <p class="welcome-text">
                Encontre pessoas, projetos e oportunidades para transformar suas ideias em realidade.
            </p>
        </div>
    </main>

    <main class="login-panel">

        <h3>Acesse sua conta</h3>

        <form id="formLogin">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Digite seu e-mail ou admin" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </main>
    
    <main class="cadastro-panel">
        <h3>Cadastre-se</h3>

        <form id="formCadastro">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" placeholder="Digite seu nome de usuário" required>

            <label for="emailCadastro">Email:</label>
            <input type="email" id="emailCadastro" name="email" placeholder="Digite seu e-mail" required>

            <label for="passwordCadastro">Senha:</label>
            <input type="password" id="passwordCadastro" name="password" placeholder="Crie uma senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagemCadastro" class="mensagem" aria-live="polite"></p>
    </main>

    <script src="/Login/script.js"></script>
</body>
</html>
