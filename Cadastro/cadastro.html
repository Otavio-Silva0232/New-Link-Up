<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Up | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Bem-vindo</h1>
        <h2>Cadastre-se</h2>

        <form id="formCadastro">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" placeholder="Digite seu nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Crie uma senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>

        <h3>Já tem uma conta? <a href="../Login/login.html">Faça login</a></h3>
    </main>

    <script src="script.js"></script>
</body>
</html>
